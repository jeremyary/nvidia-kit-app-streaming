apiVersion: v1
kind: Service
metadata:
  name: isaac-sim
  namespace: {{ include "isaac-sim-streaming.namespace" . }}
  labels:
    app.kubernetes.io/name: isaac-sim
    {{- include "isaac-sim-streaming.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: isaac-sim
  ports:
    - name: signaling-tls
      port: 8443
      targetPort: signaling-tls
      protocol: TCP
