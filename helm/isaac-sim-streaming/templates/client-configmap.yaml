apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config
  namespace: {{ include "isaac-sim-streaming.namespace" . }}
  labels:
    app.kubernetes.io/name: client
    {{- include "isaac-sim-streaming.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "signalingServer": "{{ include "isaac-sim-streaming.signalingHost" . }}",
      "turn": {
        "urls": "turns:{{ include "isaac-sim-streaming.turnHost" . }}:443?transport=tcp",
        "username": "{{ .Values.coturn.username }}",
        "credential": "{{ .Values.coturn.password }}"
      },
      "stream": {
        "width": {{ .Values.stream.width }},
        "height": {{ .Values.stream.height }},
        "fps": {{ .Values.stream.fps }}
      }
    }
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        access_log off;

        server {
            listen 8080 default_server;
            root /opt/app-root/src;
            index index.html;

            location = /config.json {
                alias /opt/app-root/config/config.json;
                default_type application/json;
                add_header Cache-Control "no-cache";
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
