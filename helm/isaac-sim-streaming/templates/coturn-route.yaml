apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: turn
  namespace: {{ include "isaac-sim-streaming.namespace" . }}
  labels:
    app.kubernetes.io/name: coturn
    {{- include "isaac-sim-streaming.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: 1h
spec:
  {{- $host := include "isaac-sim-streaming.turnHost" . }}
  {{- if $host }}
  host: {{ $host }}
  {{- end }}
  to:
    kind: Service
    name: coturn
  port:
    targetPort: turns
  tls:
    termination: passthrough
